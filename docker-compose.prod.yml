# Продакшен на одном VPS: база, кеш, API (с воркерами и реалтаймом),
# бот и Caddy, который отдаёт фронтенд и держит TLS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Наружу порт не публикуем: доступ только из docker-сети.
    expose:
      - '5432'
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - '6379'
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '4000'
    # Миграции применяются при каждом старте — идемпотентно и безопасно.
    command: >
      sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
             node apps/api/dist/index.js"
    logging: *logging

  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Бот ходит в API по внутренней сети, минуя интернет и TLS.
      API_URL: http://api:4000
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - '4100'
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
      args:
        # Пусто — фронт и API на одном домене.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      PORT: '4000'
      BOT_PORT: '4100'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - bot
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  storage-data:
  caddy-data:
  caddy-config:
