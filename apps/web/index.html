<!doctype html>
<html lang="ru" class="">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta id="theme-color" name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Корпоративная доска задач с авторизацией через Telegram" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Kaif Board</title>
    <script>
      // Тема применяется до первой отрисовки — иначе будет вспышка светлого фона.
      (function () {
        try {
          var stored = localStorage.getItem('kaif-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
          var themeColor = document.getElementById('theme-color');
          if (themeColor) {
            themeColor.setAttribute('content', dark ? '#0d1216' : '#f7f8fa');
          }
        } catch (error) {
          /* приватный режим — просто оставляем светлую тему */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
